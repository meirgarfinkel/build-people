services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 app.wsgi:application
    volumes:
      - static_volume:/app/static  # Static files collected here
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.production
      - DB_HOST=${DB_HOST}  # From AWS Parameter Store
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}  # Never hardcode!
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Nginx (Reverse Proxy + Static Files)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"  # Add if HTTPS is configured
    volumes:
      - static_volume:/app/static  # Shared with Django
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf  # Nginx config
    depends_on:
      - web
    restart: unless-stopped

  volumes:
  static_volume:
