name: Zero-Downtime Deployment with CodeDeploy

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ======================
      # 1. REPOSITORY SETUP
      # ======================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          fetch-depth: 0

      # ======================
      # 2. AWS AUTHENTICATION
      # ======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ======================
      # 3. SECRET MASKING
      # ======================
      - name: Mask AWS secrets in logs
        run: |
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/DB_HOST" --with-decryption --query "Parameter.Value" --output text)"
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)"
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/SECRET_KEY" --with-decryption --query "Parameter.Value" --output text)"

      # ======================
      # 4. IMAGE BUILD
      # ======================
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        run: |
          IMAGE_VERSION=$(date +%Y%m%d%H%M%S)
          echo "IMAGE_VERSION=${IMAGE_VERSION}" >> $GITHUB_ENV
          docker build -t mgarfinkel/build-people:${IMAGE_VERSION} -f Dockerfile.prod .
          docker push mgarfinkel/build-people:${IMAGE_VERSION}

      # ======================
      # 5. CODE DEPLOY SETUP
      # ======================
      - name: Install Python dependencies
        run: pip install boto3

      - name: Generate deployment scripts
        run: |
          # Create deployment_scripts directory
          mkdir -p deployment_scripts

          # Inject IMAGE_VERSION into image_version.sh inside deployment_scripts
          echo "export IMAGE_VERSION=${IMAGE_VERSION}" > deployment_scripts/image_version.sh

          # Create appspec.yml
          cat > appspec.yml <<'EOL'
          version: 0.0
          os: linux
          files:
            - source: deployment_scripts
              destination: /home/ec2-user/deployment_scripts
          hooks:
            BeforeInstall:
              - location: deployment_scripts/before_install.sh
                timeout: 300
                runas: root
            AfterInstall:
              - location: deployment_scripts/after_install.sh
                timeout: 300
                runas: root
          EOL

          # before_install.sh
          cat > deployment_scripts/before_install.sh <<'EOL'
          #!/bin/bash
          set -e

          # Use current deployment location instead of destination path
          DEPLOY_DIR="$(dirname "$0")"
          source "$DEPLOY_DIR/image_version.sh"

          DB_HOST=$(aws ssm get-parameter --name "/build-people/DB_HOST" --with-decryption --query "Parameter.Value" --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/build-people/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)
          SECRET_KEY=$(aws ssm get-parameter --name "/build-people/SECRET_KEY" --with-decryption --query "Parameter.Value" --output text)

          cat > "$DEPLOY_DIR/.env.deploy" <<EOF
          DB_HOST=${DB_HOST}
          DB_PASSWORD=${DB_PASSWORD}
          SECRET_KEY=${SECRET_KEY}
          IMAGE_VERSION=${IMAGE_VERSION}
          EOF

          chmod 600 "$DEPLOY_DIR/.env.deploy"
          EOL

          # after_install.sh
          cat > deployment_scripts/after_install.sh <<'EOL'
          #!/bin/bash
          set -e

          DEPLOY_DIR="/home/ec2-user/deployment_scripts"
          ENV_FILE="$DEPLOY_DIR/.env.deploy"

          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing .env.deploy file at $ENV_FILE"
            exit 1
          fi

          set -o allexport
          source "$ENV_FILE"
          set +o allexport

          echo "Starting deployment with IMAGE_VERSION: ${IMAGE_VERSION}"

          docker compose -f /home/ec2-user/docker-compose.prod.yml down || true

          docker compose --env-file "$ENV_FILE" -f /home/ec2-user/docker-compose.prod.yml up -d

          for i in {1..6}; do
            if docker ps --format '{{.Names}}' | grep -q 'build-people'; then
              echo "Container started successfully!"
              rm -f "$ENV_FILE"
              exit 0
            fi
            sleep 5
          done

          echo "Deployment failed! Current state:"
          docker ps -a
          docker compose -f /home/ec2-user/docker-compose.prod.yml logs
          exit 1
          EOL

          chmod +x deployment_scripts/*.sh
      
      # ======================
      # 6. S3 UPLOAD
      # ======================
      - name: Package and Upload to S3
        run: |
          # Package appspec.yml + scripts
          zip -r deployment.zip appspec.yml deployment_scripts/

          # Upload to S3 (with commit SHA as key)
          aws s3 cp deployment.zip s3://build-people-s3/deployments/${GITHUB_SHA}.zip

      # ======================
      # 6. TRIGGER DEPLOYMENT
      # ======================
      - name: Trigger CodeDeploy
        env:
          IMAGE_VERSION: ${{ env.IMAGE_VERSION }}
          CODEDEPLOY_APPLICATION_NAME: ${{ secrets.CODEDEPLOY_APPLICATION_NAME }}
          CODEDEPLOY_DEPLOYMENT_GROUP_NAME: ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python - <<EOF
          import boto3
          import os

          client = boto3.client('codedeploy', region_name=os.getenv('AWS_REGION'))

          response = client.create_deployment(
            applicationName=os.getenv("CODEDEPLOY_APPLICATION_NAME"),
            deploymentGroupName=os.getenv("CODEDEPLOY_DEPLOYMENT_GROUP_NAME"),
            revision={
              'revisionType': 'S3',
              's3Location': {
                'bucket': 'build-people-s3',
                'key': f'deployments/{os.getenv("GITHUB_SHA")}.zip',
                'bundleType': 'zip'
              }
            }
          )
          print(f"Deployment started: {response['deploymentId']}")
          EOF
