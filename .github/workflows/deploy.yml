name: Zero-Downtime Deployment with CodeDeploy

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ======================
      # 1. REPOSITORY SETUP
      # ======================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          fetch-depth: 0

      # ======================
      # 2. AWS AUTHENTICATION
      # ======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ======================
      # 3. MASK SECRETS IN LOGS
      # ======================
      - name: Mask Secrets in Logs
        run: |
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/DB_HOST" --with-decryption --query "Parameter.Value" --output text)"
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)"
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/SECRET_KEY" --with-decryption --query "Parameter.Value" --output text)"

      # ======================
      # 4. BUILD AND PUSH DOCKER IMAGE
      # ======================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        env:
          IMAGE_VERSION: ${{ github.sha }}
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/build-people:${IMAGE_VERSION} -f Dockerfile.prod .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/build-people:${IMAGE_VERSION}

      # ======================
      # 5. PACKAGE DEPLOYMENT ARTIFACTS
      # ======================
      - name: Package Deployment Artifacts
        run: |
          mkdir -p deployment_scripts

          # Application stop script
          cat > deployment_scripts/application_stop.sh <<EOF
          #!/bin/bash
          echo "Stopping Docker container..."
          docker stop build-people || true
          docker rm build-people || true
          EOF

          # Application start script
          cat > deployment_scripts/application_start.sh <<EOF
          #!/bin/bash
          echo "Starting Docker container..."
          source /home/ec2-user/build-people/.env
          docker run -d \\
            --name build-people \\
            -p 8000:8000 \\
            -e DB_HOST=\\\$DB_HOST \\
            -e DB_PASSWORD=\\\$DB_PASSWORD \\
            -e SECRET_KEY=\\\$SECRET_KEY \\
            ${{ secrets.DOCKERHUB_USERNAME }}/build-people:${{ github.sha }}
          EOF

          # Environment setup script
          cat > deployment_scripts/create_env_file.sh <<EOF
          #!/bin/bash
          echo "Generating .env file..."
          mkdir -p /home/ec2-user/build-people/
          DB_HOST=\$(aws ssm get-parameter --name "/build-people/DB_HOST" --with-decryption --query "Parameter.Value" --output text)
          DB_PASSWORD=\$(aws ssm get-parameter --name "/build-people/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)
          SECRET_KEY=\$(aws ssm get-parameter --name "/build-people/SECRET_KEY" --with-decryption --query "Parameter.Value" --output text)
          cat > /home/ec2-user/build-people/.env <<EOL
          DB_HOST=\$DB_HOST
          DB_PASSWORD=\$DB_PASSWORD
          SECRET_KEY=\$SECRET_KEY
          EOL
          echo ".env file created"
          EOF

          # CodeDeploy appspec
          cat > appspec.yml <<EOF
          version: 0.0
          os: linux
          files:
            - source: /
              destination: /home/ec2-user/build-people/
          hooks:
            ApplicationStop:
              - location: deployment_scripts/application_stop.sh
                timeout: 300
                runas: root
            AfterInstall:
              - location: deployment_scripts/create_env_file.sh
                timeout: 300
                runas: root
              - location: deployment_scripts/application_start.sh
                timeout: 300
                runas: root
          EOF

          zip -r deployment.zip appspec.yml deployment_scripts/

      # ======================
      # 6. UPLOAD TO S3
      # ======================
      - name: Upload to S3
        run: |
          aws s3 cp deployment.zip s3://build-people-s3/deployments/${{ github.sha }}.zip

      # ======================
      # 7. TRIGGER CODEDEPLOY
      # ======================
      - name: Trigger Deployment
        env:
          CODEDEPLOY_APPLICATION_NAME: ${{ secrets.CODEDEPLOY_APPLICATION_NAME }}
          CODEDEPLOY_DEPLOYMENT_GROUP_NAME: ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION_NAME" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP_NAME" \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --region "$AWS_REGION" \
            --revision "revisionType=S3,s3Location={bucket=build-people-s3,key=deployments/${{ github.sha }}.zip,bundleType=zip}"
