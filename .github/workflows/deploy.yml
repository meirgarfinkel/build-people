name: Zero-Downtime Deployment with CodeDeploy

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ======================
      # 1. REPOSITORY SETUP
      # ======================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          fetch-depth: 0

      # ======================
      # 2. AWS AUTHENTICATION
      # ======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ======================
      # 3. BUILD AND PUSH DOCKER IMAGE TO DOCKER HUB
      # ======================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image to Docker Hub
        env:
          IMAGE_VERSION: ${{ github.sha }}
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/build-people:${IMAGE_VERSION} -f Dockerfile.prod .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/build-people:${IMAGE_VERSION}

      # ======================
      # 4. PACKAGE DEPLOYMENT ARTIFACTS
      # ======================
      - name: Package Deployment Artifacts
        run: |
          mkdir -p deployment_scripts

          # Create application_stop.sh script
          cat > deployment_scripts/application_stop.sh <<EOF
          #!/bin/bash
          echo "Stopping Docker container..."
          docker stop build-people || true
          docker rm build-people || true
          EOF

          # Create application_start.sh script
          cat > deployment_scripts/application_start.sh <<EOF
          #!/bin/bash
          echo "Starting Docker container..."
          source /home/ec2-user/build-people/.env

          docker run -d \\
            --name build-people \\
            -p 8000:8000 \\
            -e DB_HOST=\$DB_HOST \\
            -e DB_PASSWORD=\$DB_PASSWORD \\
            -e SECRET_KEY=\$SECRET_KEY \\
            ${{ secrets.DOCKERHUB_USERNAME }}/build-people:${{ github.sha }}
          EOF

          # Create appspec.yml file for CodeDeploy lifecycle hooks
          cat > appspec.yml <<EOF
          version: 0.0
          os: linux
          files:
            - source: /
              destination: /home/ec2-user/build-people/
          hooks:
            ApplicationStop:
              - location: deployment_scripts/application_stop.sh
                timeout: 300
                runas: root
            AfterInstall:
              - location: deployment_scripts/application_start.sh
                timeout: 300
                runas: root
          EOF

          # Package everything into a zip file for CodeDeploy deployment
          zip -r deployment.zip appspec.yml deployment_scripts/

      # ======================
      # 5. UPLOAD TO S3 FOR CODEDEPLOY DEPLOYMENT ARTIFACTS
      # ======================
      - name: Upload Deployment Package to S3 Bucket for CodeDeploy
        run: |
          aws s3 cp deployment.zip s3://build-people-s3/deployments/${{ github.sha }}.zip

      # ======================
      # 6. TRIGGER CODEDEPLOY DEPLOYMENT ON EC2 INSTANCE(S)
      # ======================
      - name: Trigger CodeDeploy Deployment on EC2 Instances
        env:
          CODEDEPLOY_APPLICATION_NAME: ${{ secrets.CODEDEPLOY_APPLICATION_NAME }}
          CODEDEPLOY_DEPLOYMENT_GROUP_NAME: ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }}
        run: |
          aws deploy create-deployment \
            --application-name $CODEDEPLOY_APPLICATION_NAME \
            --deployment-group-name $CODEDEPLOY_DEPLOYMENT_GROUP_NAME \
            --revision revisionType=S3,s3Location={bucket=build-people-s3,key=deployments/${{ github.sha }}.zip,bundleType=zip} \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --region $AWS_REGION
