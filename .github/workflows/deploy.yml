name: Zero-Downtime Deployment with CodeDeploy

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ======================
      # 1. REPOSITORY SETUP
      # ======================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Debug OIDC Token
        run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq

      # ======================
      # 2. AWS AUTHENTICATION
      # ======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ======================
      # 3. SECRET MASKING
      # ======================
      - name: Mask AWS secrets in logs
        run: |
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/DB_HOST" --with-decryption --query "Parameter.Value" --output text)"
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)"
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/SECRET_KEY" --with-decryption --query "Parameter.Value" --output text)"

      # ======================
      # 4. IMAGE BUILD
      # ======================
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        run: |
          IMAGE_VERSION=$(date +%Y%m%d%H%M%S)
          echo "IMAGE_VERSION=${IMAGE_VERSION}" >> $GITHUB_ENV
          docker build -t mgarfinkel/build-people:${IMAGE_VERSION} -f Dockerfile.prod .
          docker push mgarfinkel/build-people:${IMAGE_VERSION}

      # ======================
      # 5. CODE DEPLOY SETUP
      # ======================
      - name: Install Python dependencies
        run: pip install boto3

      - name: Generate deployment scripts
        run: |
          # Create appspec.yml
          cat > appspec.yml <<EOL
          version: 0.0
          os: linux
          files:
            - source: scripts
              destination: /home/ec2-user/deployment_scripts
          hooks:
            BeforeInstall:
              - location: scripts/before_install.sh
                timeout: 300
                runas: root
            AfterInstall:
              - location: scripts/after_install.sh
                timeout: 300
                runas: root
          EOL

          # Create deployment scripts
          mkdir -p scripts
          cat > scripts/before_install.sh <<'EOL'
          #!/bin/bash
          # Fetch secrets from SSM
          DB_HOST=$(aws ssm get-parameter --name "/build-people/DB_HOST" --with-decryption --query "Parameter.Value" --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/build-people/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)
          SECRET_KEY=$(aws ssm get-parameter --name "/build-people/SECRET_KEY" --with-decryption --query "Parameter.Value" --output text)
          
          # Export for use in after_install
          echo "export DB_HOST=${DB_HOST}" > /tmp/deployment_secrets
          echo "export DB_PASSWORD=${DB_PASSWORD}" >> /tmp/deployment_secrets
          echo "export SECRET_KEY=${SECRET_KEY}" >> /tmp/deployment_secrets
          echo "export IMAGE_VERSION=${IMAGE_VERSION}" >> /tmp/deployment_secrets
          EOL

          cat > scripts/after_install.sh <<'EOL'
          #!/bin/bash
          # Load secrets
          source /tmp/deployment_secrets
          
          # Create versioned resources
          NEW_VOLUME="static_${IMAGE_VERSION}"
          NEW_COMPOSE="docker-compose.${IMAGE_VERSION}.yml"
          docker volume create ${NEW_VOLUME}

          # Build assets with secret injection
          docker run --rm \
            -v ${NEW_VOLUME}:/app/staticfiles \
            -v $(pwd)/theme/static_src:/app/theme/static_src \
            -e DB_HOST="${DB_HOST}" \
            -e SECRET_KEY="${SECRET_KEY}" \
            mgarfinkel/build-people:${IMAGE_VERSION} \
            sh -c "python manage.py tailwind build && python manage.py collectstatic --noinput --clear"

          # Prepare deployment
          cp docker-compose.prod.yml ${NEW_COMPOSE}
          sed -i "s/static_volume:/${NEW_VOLUME}:/" ${NEW_COMPOSE}
          sed -i "s/image:.*/image: mgarfinkel\/build-people:${IMAGE_VERSION}/" ${NEW_COMPOSE}

          # Deploy with secrets
          DB_HOST="${DB_HOST}" \
          DB_PASSWORD="${DB_PASSWORD}" \
          SECRET_KEY="${SECRET_KEY}" \
          docker compose -f ${NEW_COMPOSE} up -d

          # Run migrations
          docker compose -f ${NEW_COMPOSE} exec -T web \
            python manage.py migrate --noinput

          # Health check
          for i in {1..6}; do
            if docker compose -f ${NEW_COMPOSE} ps web | grep healthy; then
              echo "Deployment successful!"
              
              # Cleanup old volumes (keep last 2)
              docker volume ls -q --filter name=static_ | sort -r | tail -n +3 | xargs -r docker volume rm
              
              # Update symlink
              ln -sf ${NEW_COMPOSE} docker-compose.current.yml
              exit 0
            fi
            sleep 5
          done

          # Rollback procedure
          echo "Deployment failed - initiating rollback"
          docker compose -f docker-compose.current.yml up -d
          docker volume rm ${NEW_VOLUME}
          rm ${NEW_COMPOSE}
          exit 1
          EOL

          chmod +x scripts/*.sh

      # ======================
      # 6. TRIGGER DEPLOYMENT
      # ======================
      - name: Trigger CodeDeploy
        env:
          IMAGE_VERSION: ${{ env.IMAGE_VERSION }}
          CODEDEPLOY_APPLICATION_NAME: ${{ secrets.CODEDEPLOY_APPLICATION_NAME }}
          CODEDEPLOY_DEPLOYMENT_GROUP_NAME: ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP_NAME }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python - <<EOF
          import boto3
          import os

          client = boto3.client('codedeploy', region_name=os.getenv('AWS_REGION'))

          response = client.create_deployment(
              applicationName=os.getenv('CODEDEPLOY_APPLICATION_NAME'),
              deploymentGroupName=os.getenv('CODEDEPLOY_DEPLOYMENT_GROUP_NAME'),
              revision={
                  'revisionType': 'GitHub',
                  'gitHubLocation': {
                      'repository': os.getenv('GITHUB_REPO'),
                      'commitId': os.getenv('GITHUB_COMMIT_SHA')
                  }
              },
              description=f'Deployment for image version {os.getenv("IMAGE_VERSION")}'
          )
          print(f"Deployment started: {response['deploymentId']}")
          EOF
