name: Zero-Downtime Deployment with CodeDeploy

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  id-token: write

env:
  DOCKER_IMAGE: mgarfinkel/build-people
  S3_BUCKET: build-people-s3
  APPLICATION_NAME: build-people
  DEPLOYMENT_GROUP: build-people-deployment-group
  DEPLOYMENT_BUNDLE: deployment.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. REPOSITORY SETUP
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          fetch-depth: 0

      # 2. AWS AUTHENTICATION
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. TLS Injection
      - name: Write TLS cert
        run: |
          mkdir -p nginx/ssl
          echo "${{ secrets.CLOUDFLARE_CERT }}" > nginx/ssl/cloudflare.crt
          echo "${{ secrets.CLOUDFLARE_KEY }}" > nginx/ssl/cloudflare.key

      # 4. BUILD AND PUSH DOCKER IMAGE
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set IMAGE_VERSION with timestamp
        run: echo "IMAGE_VERSION=${{ github.sha }}-$(date +'%m-%d-%H-%M')" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build --platform linux/amd64 -f Dockerfile.prod -t $DOCKER_IMAGE:${IMAGE_VERSION} .

      - name: Push Docker Image
        run: |
          docker push $DOCKER_IMAGE:${IMAGE_VERSION}

      # 5. PACKAGE DEPLOYMENT BUNDLE
      - name: Write image version and Docker Hub credentials to .env
        run: |
          echo "IMAGE_VERSION=${IMAGE_VERSION}" > .env
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
          echo "DOCKERHUB_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}" >> .env

      - name: Create Deployment Bundle
        run: |
          zip -r ${DEPLOYMENT_BUNDLE} appspec.yml scripts/ docker-compose.prod.yml .env nginx/ssl/

      # 6. UPLOAD deployment.zip TO S3
      - name: Upload to S3
        run: |
          aws s3 cp ${DEPLOYMENT_BUNDLE} s3://${S3_BUCKET}/${IMAGE_VERSION}/${DEPLOYMENT_BUNDLE}

      # 7. DEPLOY WITH CODEDEPLOY
      - name: Deploy to AWS CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name $APPLICATION_NAME \
            --deployment-group-name $DEPLOYMENT_GROUP \
            --s3-location bucket=$S3_BUCKET,key=$IMAGE_VERSION/$DEPLOYMENT_BUNDLE,bundleType=zip \
            --file-exists-behavior OVERWRITE

      - name: Deployment Info
        run: echo "Deployment triggered. Check CodeDeploy console for status."

      # 8. Clean up TLS secrets from workspace
      # - name: Clean TLS certs from workspace
      #   run: rm -f nginx/ssl/cloudflare.*
