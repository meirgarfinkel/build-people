name: Zero-Downtime Deployment with CodeDeploy

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read
  id-token: write

env:
  IMAGE_VERSION: ${{ github.sha }}
  DOCKER_IMAGE: mgarfinkel/build-people
  S3_BUCKET: build-people-s3  # replace with your S3 bucket name
  APPLICATION_NAME: build-people  # replace with your CodeDeploy application name
  DEPLOYMENT_GROUP: build-people-deployment-group  # replace with your deployment group name
  DEPLOYMENT_BUNDLE: deployment.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ======================
      # 1. REPOSITORY SETUP
      # ======================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          fetch-depth: 0

      # ======================
      # 2. AWS AUTHENTICATION
      # ======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ======================
      # 3. MASK SECRETS IN LOGS
      # ======================
      - name: Mask Secrets in Logs
        run: |
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/DB_HOST" --with-decryption --query "Parameter.Value" --output text)"
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)"
          echo "::add-mask::$(aws ssm get-parameter --name "/build-people/SECRET_KEY" --with-decryption --query "Parameter.Value" --output text)"

      # ======================
      # 4. BUILD AND PUSH DOCKER IMAGE
      # ======================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -f dockerfile.prod -t $DOCKER_IMAGE:${IMAGE_VERSION} .

      - name: Push Docker Image
        run: |
          docker push $DOCKER_IMAGE:${IMAGE_VERSION}

      # ======================
      # 5. PACKAGE DEPLOYMENT BUNDLE
      # ======================
      # This step assumes you have an appspec.yml and (optional) scripts directory at the root of your repo.
      - name: Create Deployment Bundle
        run: |
          zip -r ${DEPLOYMENT_BUNDLE} appspec.yml scripts/

      # ======================
      # 6. UPLOAD TO S3
      # ======================
      - name: Upload to S3
        run: |
          aws s3 cp ${DEPLOYMENT_BUNDLE} s3://${S3_BUCKET}/${IMAGE_VERSION}/${DEPLOYMENT_BUNDLE}

      # ======================
      # 7. DEPLOY WITH CODEDEPLOY
      # ======================
      - name: Deploy to AWS CodeDeploy
        id: codedeploy
        uses: aws-actions/aws-codedeploy-deploy@v1
        with:
          application-name: ${{ env.APPLICATION_NAME }}
          deployment-group: ${{ env.DEPLOYMENT_GROUP }}
          deployment-revision: |
            {
              "revisionType": "S3",
              "s3Location": {
                "bucket": "${{ env.S3_BUCKET }}",
                "key": "${{ env.IMAGE_VERSION }}/${{ env.DEPLOYMENT_BUNDLE }}",
                "bundleType": "zip"
              }
            }

      - name: Deployment Info
        run: echo "Deployment triggered. Check CodeDeploy console for status."
