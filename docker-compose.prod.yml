version: '3.8'

services:
  web:
    image: your-dockerhub-username/build-people:${IMAGE_VERSION}
    environment:
      - DB_HOST=${DB_HOST}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - static_${IMAGE_VERSION}:/app/staticfiles  # Versioned volume
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      timeout: 5s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_${IMAGE_VERSION}:/var/www/static  # Same versioned volume
    depends_on:
      web:
        condition: service_healthy

volumes:
  static_${IMAGE_VERSION}:  # Dynamically named volume
    external: false
