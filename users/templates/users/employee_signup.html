{% extends "base.html" %}
{% block content %}
    <div class="flex justify-center bg-gray-100">
        <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
            <h2 class="text-center text-2xl font-semibold text-gray-800">Sign Up</h2>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}"
                               class="block text-sm font-medium text-gray-700">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<p class="mt-1 text-sm text-red-500">{{ field.errors.as_text }}</p>{% endif %}
                    </div>
                {% endfor %}
                <button type="submit"
                        class="w-full rounded-lg bg-blue-600 py-2.5 font-medium text-white transition-all hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    Sign Up
                </button>
            </form>
            <p class="mt-4 text-center text-sm text-gray-600">
                Already have an account?
                <a href="{% url 'users:login' %}" class="text-blue-600 hover:underline">Log in</a>
            </p>
        </div>
    </div>
{% endblock content %}
