{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block content %}
    <div class="w-full flex justify-center p-4">
        <div class="w-full md:w-1/3 rounded-xl bg-white p-8 shadow-lg">
            <h2 class="text-center text-2xl font-semibold text-gray-800">Sign Up & Create Company</h2>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit"
                        class="w-full rounded-xl bg-blue-600 py-2.5 font-medium text-white transition-all hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    Sign Up
                </button>
            </form>
            <p class="mt-4 text-center text-sm text-gray-600">
                Already have an account?
                <a href="{% url 'users:login' %}" class="text-blue-600 hover:underline">Log in</a>
            </p>
        </div>
    </div>
{% endblock content %}
