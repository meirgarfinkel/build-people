{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block content %}
    <div class="flex justify-center w-full p-4" id="login-form">
        <div class="p-8 bg-white shadow-lg md:w-1/3 rounded-xl">
            <h2 class="text-2xl font-semibold text-center text-gray-800">Log In</h2>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit"
                        class="w-full py-2 mt-4 text-white bg-blue-600 rounded-xl hover:bg-blue-700">
                    Log In
                </button>
            </form>
            <p class="mt-4 text-sm text-gray-600">
                Don't have an account?
                <a href="{% url 'users:employer_signup' %}"
                   class="text-blue-600 hover:underline">Sign up</a>
            </p>
        </div>
    </div>
{% endblock content %}
