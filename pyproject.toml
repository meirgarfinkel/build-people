[project]
name = "gratify-2"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "django ~=5.1",
  "django-debug-toolbar ~=4.4",
  "gunicorn ~=23.0",
  "psycopg[binary] ~=3.2",
  "whitenoise ~=6.7",
  "django-tailwind>=3.8.0",
  "crispy-tailwind>=1.0.3",
  "hx-requests>=0.35.5",
]

[dependency-groups]
dev = [
  "cookiecutter>=2.6.0",
  "djlint>=1.36.4",
  "python-dotenv>=1.0.1",
  "ruff>=0.11.2",
  "typing_extensions ~=4.12",
]
