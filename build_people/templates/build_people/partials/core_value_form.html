{% extends "base.html" %}
{% load hx_tags %}

{% block content %}
    <div id="core-values-list" class="flex justify-center w-full p-4">
        <div class="p-6 bg-white md:w-5/12 rounded-xl">
            <h2 class="mb-4 text-2xl font-semibold text-center">Core Value:</h2>
            <form method="post" {% hx_post "create_update_core_value" object=core_value %} hx-target="#core-values-list" hx-swap="outerHTML">
                {% csrf_token %}
                <div class="mt-3 ">
                    <label class="pr-2 text-lg font-medium text-gray-700">Name:</label>
                    <input type="text"
                        name="name"
                        placeholder="Enter core value..."
                        value="{{ form.name.value|default:'' }}"
                        class="w-full border border-gray-200 rounded-xl py-1 px-2 focus:ring focus:ring-blue-300
                                {% if form.name.errors %}border-red-500{% endif %}">
                    {% for error in form.name.errors %}<p class="text-sm text-red-500">{{ error }}</p>{% endfor %}
                </div>
                <div class="mt-3">
                    <button type="submit" class="p-2 text-white bg-blue-500 hover:bg-blue-600 rounded-xl">Add Core Value</button>
                </div>
            </form>
        </div>
    </div>
{% endblock content %}
