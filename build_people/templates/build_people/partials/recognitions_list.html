{% load hx_tags %}
{% load build_people_tags %}

<div class="pb-3 md:hidden">
    <div id="recognition-form-container-mobile"
        {% hx_get "create_recognition" %}
        hx-trigger="load"
        hx-swap="outerHTML"
        hx-target="#recognition-form-container-mobile">
    </div>
</div>
<div id="recognitions-list">
    {% for recognition in recognitions %}
        {% render_recognition %}
    {% empty %}
        <p>Nothing here yet, be the first!</p>
    {% endfor %}
</div>
