{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon"
              type="image/x-icon"
              href="{% static 'theme/images/favicon.ico' %}">
        <title>Responsive Preview</title>
        <style>
            body {
                margin: 0;
                background: #222;
                overflow: hidden;
            }
            .container {
                display: flex;
                gap: 15px; /* Space between iframes */
                overflow-x: auto; /* Enables horizontal scrolling */
                white-space: nowrap;
                width: 100vw;
                height: 100vh;
            }
            .preview {
                border: 2px solid #fff;
                background: #000;
                flex-shrink: 0; /* Prevents iframes from shrinking */
            }
        </style>
    </head>
    <body>
        <div class="container">
            <iframe class="preview"
                    src="{{ url }}"
                    width="1600"
                    height="980"
                    title="Desktop"></iframe>
            <iframe class="preview"
                    src="{{ url }}"
                    width="375"
                    height="667"
                    title="Mobile"></iframe>
            <iframe class="preview"
                    src="{{ url }}"
                    width="1280"
                    height="800"
                    title="Laptop"></iframe>
        </div>
    </body>
</html>
